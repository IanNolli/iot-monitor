# Smart Home AIoT — sobe a solução inteira com: docker compose up -d
# Antes da primeira vez: ./scripts/gerar-segredos.sh (cria o .env com as senhas)
#
# Portas publicadas:
#   8080             aplicação Web (única porta da aplicação)
#   127.0.0.1:15672  RabbitMQ (gerenciamento)   | só nesta máquina, para estudo
#   127.0.0.1:8086   InfluxDB                   |
#   127.0.0.1:5050   pgAdmin (PostgreSQL)       |

name: aiot

x-servico-python: &servico-python
  restart: unless-stopped
  build: &build-python
    context: ./services
  environment: &env-rabbit
    RABBIT_HOST: rabbitmq
    RABBIT_VHOST: aiot

services:
  # ---------- infraestrutura ----------
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    command: ["sh", "/mosquitto/config/iniciar.sh"]
    environment:
      MQTT_SENHA_SIMULADOR: ${MQTT_SENHA_SIMULADOR:?rode ./scripts/gerar-segredos.sh}
      MQTT_SENHA_GATEWAY: ${MQTT_SENHA_GATEWAY:?rode ./scripts/gerar-segredos.sh}
      MQTT_SENHA_MONITOR: ${MQTT_SENHA_MONITOR:?rode ./scripts/gerar-segredos.sh}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u monitor -P \"$$MQTT_SENHA_MONITOR\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    mem_limit: 512m
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_SENHA_ADMIN:?rode ./scripts/gerar-segredos.sh}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  rabbit-init:
    mem_limit: 128m
    build:
      context: ./services/rabbit-init
    environment:
      RABBITMQ_SENHA_ADMIN: ${RABBITMQ_SENHA_ADMIN}
      RABBIT_SENHA_GATEWAY: ${RABBIT_SENHA_GATEWAY:?rode ./scripts/gerar-segredos.sh}
      RABBIT_SENHA_GRAVADOR: ${RABBIT_SENHA_GRAVADOR:?}
      RABBIT_SENHA_INFERENCIA: ${RABBIT_SENHA_INFERENCIA:?}
      RABBIT_SENHA_LAB: ${RABBIT_SENHA_LAB:?}
      RABBIT_SENHA_API: ${RABBIT_SENHA_API:?}
    depends_on:
      rabbitmq:
        condition: service_healthy

  postgres:
    mem_limit: 256m
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiot
      POSTGRES_DB: aiot
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?rode ./scripts/gerar-segredos.sh}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiot -d aiot"]
      interval: 5s
      timeout: 3s
      retries: 12

  influxdb:
    mem_limit: 512m
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_SENHA:?rode ./scripts/gerar-segredos.sh}
      DOCKER_INFLUXDB_INIT_ORG: casa
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?rode ./scripts/gerar-segredos.sh}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgadmin:
    mem_limit: 384m
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_SENHA:?rode ./scripts/gerar-segredos.sh}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0   # o padrão é IPv6 ([::]), desligado nas redes do Docker Desktop
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    mem_limit: 3g
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        # mantém o modelo carregado na memória
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Baixa o modelo (na primeira vez, ~2 GB) e já o deixa carregado para a demonstração
  ollama-init:
    mem_limit: 256m
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODELO:-llama3.2:3b} && ollama run ${OLLAMA_MODELO:-llama3.2:3b} 'Responda apenas: pronto'"]
    depends_on:
      ollama:
        condition: service_healthy

  # ---------- aplicação ----------
  simulador:
    mem_limit: 192m
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: simulador/Dockerfile
    environment:
      MQTT_SENHA_SIMULADOR: ${MQTT_SENHA_SIMULADOR}
    depends_on:
      mosquitto:
        condition: service_healthy

  gateway:
    mem_limit: 192m
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: gateway/Dockerfile
    environment:
      <<: *env-rabbit
      MQTT_SENHA_GATEWAY: ${MQTT_SENHA_GATEWAY}
      RABBIT_SENHA_GATEWAY: ${RABBIT_SENHA_GATEWAY}
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbit-init:
        condition: service_completed_successfully

  gravador:
    mem_limit: 192m
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: gravador/Dockerfile
    environment:
      <<: *env-rabbit
      RABBIT_SENHA_GRAVADOR: ${RABBIT_SENHA_GRAVADOR}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on:
      influxdb:
        condition: service_healthy
      rabbit-init:
        condition: service_completed_successfully

  inferencia:
    mem_limit: 384m
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: inferencia/Dockerfile
    environment:
      <<: *env-rabbit
      RABBIT_SENHA_INFERENCIA: ${RABBIT_SENHA_INFERENCIA}
    volumes:
      - modelos:/modelos:ro
    depends_on:
      rabbit-init:
        condition: service_completed_successfully

  lab:
    mem_limit: 1g
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: lab/Dockerfile
    environment:
      <<: *env-rabbit
      RABBIT_SENHA_LAB: ${RABBIT_SENHA_LAB}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - modelos:/modelos
      - dados:/dados
    depends_on:
      influxdb:
        condition: service_healthy
      rabbit-init:
        condition: service_completed_successfully

  api:
    mem_limit: 384m
    <<: *servico-python
    build:
      <<: *build-python
      dockerfile: api/Dockerfile
    environment:
      <<: *env-rabbit
      RABBIT_SENHA_API: ${RABBIT_SENHA_API}
      POSTGRES_SENHA: ${POSTGRES_SENHA}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      JWT_SEGREDO: ${JWT_SEGREDO:?rode ./scripts/gerar-segredos.sh}
      SENHA_ADMINISTRADOR: ${SENHA_ADMINISTRADOR:?}
      SENHA_OPERADOR: ${SENHA_OPERADOR:?}
      SENHA_VISUALIZADOR: ${SENHA_VISUALIZADOR:?}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-llama3.2:3b}
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      rabbit-init:
        condition: service_completed_successfully

  frontend:
    mem_limit: 64m
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  rabbitmq:
  postgres:
  influxdb:
  ollama:
  modelos:
  dados:
