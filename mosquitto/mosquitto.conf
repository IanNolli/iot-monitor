# Mosquitto: protocolo de borda entre o simulador e a aplicação.
# Sem acesso anônimo; cada cliente tem usuário próprio e permissões por tópico (acl).

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
