# Configuração mínima do broker — Smart Home, Monitoramento de Temperatura
#
# Sem configuração, o Mosquitto 2.x escuta apenas em localhost. Ao declarar
# um listener, ele passa a recusar clientes sem login; por isso liberamos o
# acesso anônimo. Adequado apenas para desenvolvimento local
# (autenticação está fora do escopo do 1º bimestre).

listener 1883
allow_anonymous true
